<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Embroidery look</title>
<style>
  :root { --bg: #ecebe7; --ink: #1c1c1c; --muted: #6b6b6b; --panel: rgba(255,255,255,.82); }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.4 system-ui, sans-serif; }
  #view { position: fixed; inset: 0; }
  .ui { position: fixed; left: 16px; right: 16px; bottom: 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
        background: var(--panel); backdrop-filter: blur(8px); padding: 10px 14px; border-radius: 10px; max-width: 760px; margin: 0 auto; }
  .ui button { border: 1px solid #ccc; background: #fff; border-radius: 6px; padding: 6px 10px; cursor: pointer; font: inherit; }
  .ui button[aria-pressed=true] { background: var(--ink); color: #fff; border-color: var(--ink); }
  .ui input[type=range] { flex: 1; min-width: 120px; }
  #stats { color: var(--muted); font-size: 12px; width: 100%; }
</style>
<script type="importmap">
{ "imports": {
  "three": "../node_modules/three/build/three.module.js",
  "three/addons/": "../node_modules/three/examples/jsm/"
} }
</script>
</head>
<body>
<div id="view"></div>
<div class="ui">
  <span id="looks"></span>
  <label for="t">Progress</label>
  <input id="t" type="range" min="0" max="1" step="0.001" value="1">
  <input id="file" type="file" accept=".svg,image/svg+xml">
  <div id="stats">Loading…</div>
</div>
<script type="module">
import { EmbroideryScene, LOOKS } from '../src/renderer.js';

const params = new URLSearchParams(location.search);
const lookKey = params.get('look') || 'studio';
const embroidery = new EmbroideryScene(document.getElementById('view'), { preset: LOOKS[lookKey] });
const stats = document.getElementById('stats');
const looksEl = document.getElementById('looks');
for (const [key, look] of Object.entries(LOOKS)) {
  const b = document.createElement('button');
  b.textContent = look.name; b.setAttribute('aria-pressed', key === lookKey);
  b.onclick = () => {
    embroidery.applyLook(look);
    looksEl.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b));
  };
  looksEl.appendChild(b);
}
const slider = document.getElementById('t');
slider.oninput = () => embroidery.setProgress(+slider.value);
async function load(svg) {
  const r = await embroidery.setSVG(svg);
  stats.textContent = `${r.count} stitches · drag to orbit, scroll to zoom`;
  window.__stitchResult = r;
}
document.getElementById('file').onchange = async e => { const f = e.target.files[0]; if (f) load(await f.text()); };
if (params.has('t')) { slider.value = params.get('t'); }
await load(await (await fetch(params.get('svg') || '../assets/sp-roundel.svg')).text());
embroidery.setProgress(+slider.value);
if (params.has('hideui')) document.querySelector('.ui').style.display = 'none';
</script>
</body>
</html>
