<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stitch engine preview</title>
<style>
  :root { --bg: #f4f3ef; --ink: #1c1c1c; --muted: #6b6b6b; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.4 system-ui, sans-serif; display: grid; place-items: center; min-height: 100vh; }
  .wrap { display: grid; gap: 12px; padding: 16px; max-width: 720px; width: 100%; box-sizing: border-box; }
  canvas { width: 100%; aspect-ratio: 1; background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  input[type=range] { flex: 1; }
  #stats { color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <canvas id="c" width="1024" height="1024"></canvas>
  <div class="row">
    <label for="t">Progress</label>
    <input id="t" type="range" min="0" max="1" step="0.001" value="1">
    <input id="file" type="file" accept=".svg,image/svg+xml">
  </div>
  <div id="stats">Loading…</div>
</div>
<script type="module">
import { svgToStitches } from '../src/stitch-engine.js';

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const slider = document.getElementById('t');
const stats = document.getElementById('stats');
let result = null;

function draw(t) {
  const S = canvas.width;
  ctx.clearRect(0, 0, S, S);
  if (!result) return;
  const toPx = ([x, y]) => [(x + 0.5) * S, (0.5 - y) * S];
  ctx.lineCap = 'round';
  for (const layer of result.layers) {
    for (const region of layer.regions) {
      for (const s of region.stitches) {
        if (s.t > t) continue;
        const [ax, ay] = toPx(s.a), [bx, by] = toPx(s.b);
        ctx.strokeStyle = layer.colour;
        ctx.lineWidth = 2.4;
        ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();
        ctx.strokeStyle = 'rgba(255,255,255,0.18)';
        ctx.lineWidth = 0.8;
        ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();
      }
    }
  }
}

async function load(svgText) {
  stats.textContent = 'Computing stitches…';
  const t0 = performance.now();
  result = await svgToStitches(svgText);
  const ms = Math.round(performance.now() - t0);
  const regions = result.layers.reduce((n, l) => n + l.regions.length, 0);
  stats.textContent = `${result.count} stitches · ${result.layers.length} colour layer(s) · ${regions} region(s) · ${ms} ms`;
  window.__stitchResult = result;
  draw(+slider.value);
}

slider.addEventListener('input', () => draw(+slider.value));
document.getElementById('file').addEventListener('change', async e => {
  const f = e.target.files[0];
  if (f) load(await f.text());
});
const params = new URLSearchParams(location.search);
if (params.has('t')) slider.value = params.get('t');
load(await (await fetch(params.get('svg') || '../assets/sp-roundel.svg')).text());
</script>
</body>
</html>
